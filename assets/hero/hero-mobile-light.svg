<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1068" viewBox="0 0 640 1068" role="img" aria-labelledby="title">
<title id="title">Rohit Awasthi — AI &amp; full-stack builder</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F8FA"/></linearGradient>
  <linearGradient id="ascii-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F2328"/><stop offset="1" stop-color="#0969DA"/></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D0D7DE"/><stop offset="0.5" stop-color="#0969DA"/><stop offset="1" stop-color="#D0D7DE"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0969DA" stop-opacity="0"/><stop offset="0.5" stop-color="#0969DA" stop-opacity="0.35"/><stop offset="1" stop-color="#0969DA" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#0969DA" stop-opacity="0.14"/><stop offset="1" stop-color="#0969DA" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#59636E" stroke-width="0.6" opacity="0.12"/></pattern>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#0969DA" opacity="0.04"/></pattern>
  <clipPath id="pclip"><rect x="24" y="72" width="592" height="400" rx="12"/></clipPath>
</defs>
  <style>
    text, tspan { white-space: pre; font-family: 'Courier New', Consolas, monospace; }
    .ascii { font-size: 6.6px; letter-spacing: -0.2px; fill: url(#ascii-grad); }
    .label { font-size: 11px; letter-spacing: 2px; fill: #59636E; }
    .term { font-size: 12px; fill: #59636E; }
    .live { font-size: 10px; letter-spacing: 1px; fill: #1A7F37; font-weight: 700; }
    .prompt { font-size: 15px; fill: #0969DA; font-weight: 700; }
    .head { font-size: 22px; fill: #1F2328; font-weight: 700; }
    .key { font-size: 14px; fill: #0969DA; font-weight: 700; }
    .val { font-size: 14px; fill: #1F2328; }
    .sec { font-size: 12px; letter-spacing: 2px; fill: #8250DF; font-weight: 700; }
    .repo { font-size: 14px; fill: #8250DF; font-weight: 700; }
    .desc { font-size: 13px; fill: #59636E; }
    .orbit { transform-box: view-box; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-back { to { transform: rotate(-360deg); } }
    @keyframes sweep { from { transform: translateY(-60px); } to { transform: translateY(700px); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes reveal { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: no-preference) {
      .spin { animation: spin 40s linear infinite; }
      .spin-back { animation: spin-back 30s linear infinite; }
      .sweep { animation: sweep 7s linear infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .line { animation: reveal 0.5s ease-out both; }
    }
    @media (prefers-reduced-motion: reduce) { .sweep { display: none; } }
  </style>
